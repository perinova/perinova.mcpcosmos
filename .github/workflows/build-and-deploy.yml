name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      acr_name:
        description: 'Azure Container Registry Name'
        required: true
        default: 'neurasupportdevapiacr'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push to ACR
        run: |
          ACR=${{ github.event.inputs.acr_name || 'neurasupportdevapiacr' }}
          az acr build \
            --registry $ACR \
            --image cosmos-mcp-humanloop:latest \
            .